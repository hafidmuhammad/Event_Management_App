<!doctype html>
<html lang="id">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CDP Events — Orbit Link Loading</title>
<style>
  *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#081b30;color:#e8eef7;font:16px system-ui,sans-serif}main{text-align:center;padding:32px}img{width:min(320px,75vw);height:auto}h1{font-size:24px;margin:12px 0 6px;letter-spacing:.08em}p{color:#b1c1d6;margin:0 0 30px}button{border:1px solid #637b98;border-radius:999px;background:transparent;color:inherit;padding:10px 20px;font:inherit;cursor:pointer}body.light{background:#f5f7fb;color:#112d4b}body.light p{color:#516781}button:focus-visible{outline:3px solid #159aff;outline-offset:4px}
</style>
<main>
  <img src="orbit-link-loading.svg" alt="Animasi loading Orbit Link CDP Events">
  <h1>CDP EVENTS</h1>
  <p role="status">Menyiapkan acara…</p>
  <button type="button" aria-pressed="false" onclick="document.body.classList.toggle('light');this.setAttribute('aria-pressed',document.body.classList.contains('light'))">Latar terang / gelap</button>
</main>
</html>
